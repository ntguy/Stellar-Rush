<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Rush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&family=Audiowide&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
        }

        /* ── HUD ─────────────────────────────────────────── */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #hud.hidden {
            opacity: 0;
        }

        #score {
            font-size: 28px;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px #0af;
        }

        #fuel-wrap {
            width: 200px;
            height: 14px;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        #fuel-bar {
            height: 100%;
            width: 100%;
            border-radius: 7px;
            background: linear-gradient(90deg, #0af, #0ff);
            transition: width 0.1s linear;
        }

        #fuel-bar.low {
            animation: pulse-fuel 0.4s infinite;
        }

        @keyframes pulse-fuel {
            50% {
                opacity: 0.5;
            }
        }

        #boost-indicator {
            font-size: 11px;
            color: #0ff;
            margin-top: 4px;
            letter-spacing: 3px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        #shield-indicator {
            font-size: 11px;
            color: #33aaff;
            margin-top: 2px;
            letter-spacing: 3px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        /* ── Game Over overlay ────────────────────────────── */
        #game-over {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            background: rgba(0, 0, 0, 0.75);
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            text-align: center;
        }

        #game-over.show {
            display: grid;
        }

        #game-over h1 {
            font-size: 52px;
            color: #f43;
            letter-spacing: 6px;
        }

        #game-over .sub {
            font-size: 22px;
            margin-top: 8px;
            color: #aaa;
        }

        #game-over button {
            margin-top: 28px;
        }

        /* ── Menu button (top-right during gameplay) ──────── */
        #menu-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
            z-index: 100;
        }

        #menu-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        #menu-btn.visible {
            display: flex;
        }

        #menu-btn svg {
            width: 22px;
            height: 22px;
        }

        #menu-btn svg line {
            stroke: #ccc;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* ── Pause overlay ────────────────────────────────── */
        #pause-menu {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            background: rgba(0, 0, 5, 0.78);
            z-index: 200;
            font-family: 'Orbitron', 'Courier New', monospace;
        }

        #pause-menu.show {
            display: grid;
        }

        #pause-menu .pause-inner {
            text-align: center;
        }

        #pause-menu h2 {
            font-size: 36px;
            color: #ffffff;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(0, 170, 255, 0.5);
            margin-bottom: 40px;
        }

        #pause-menu button {
            padding: 14px 44px;
            font-family: 'Orbitron', monospace;
            font-size: 15px;
            letter-spacing: 3px;
            background: transparent;
            color: #aaccff;
            border: 1px solid rgba(0, 170, 255, 0.35);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s;
        }

        #pause-menu button:hover {
            background: rgba(0, 170, 255, 0.12);
            border-color: rgba(0, 170, 255, 0.7);
            color: #fff;
            text-shadow: 0 0 10px #0af;
        }

        .pause-btns {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .pause-btns .btn-premium {
            width: 320px;
            padding: 16px 0;
            font-size: 14px;
        }

        /* ── Main Menu overlay ────────────────────────────── */
        #main-menu {
            position: absolute;
            inset: 0;
            display: none;
            z-index: 50;
            pointer-events: none;
        }

        /* ── Title container ──────────────────────────────── */
        #title-container {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translate(-50%, 20px);
            opacity: 0;
            transition: opacity 1.0s ease, transform 1.0s ease;
            text-align: center;
            pointer-events: none;
        }

        #title-container.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        #title-stellar,
        #title-rush {
            display: block;
            font-weight: 900;
            line-height: 1.1;
        }

        #title-rush {
            margin-top: 4px;
        }

        /* ── Slide-glow animation (variation 1) ──────────── */
        .anim-slide-glow #title-stellar {
            animation: slideFromLeft 1s ease-out forwards;
        }

        .anim-slide-glow #title-rush {
            animation: slideFromRight 1s 0.2s ease-out both;
        }

        @keyframes slideFromLeft {
            from {
                transform: translateX(-80px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideFromRight {
            from {
                transform: translateX(80px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ── Glitch animation (variation 2) ──────────────── */
        .anim-glitch #title-stellar,
        .anim-glitch #title-rush {
            animation: glitchIn 0.6s steps(8) both;
            position: relative;
        }

        .anim-glitch #title-rush {
            animation-delay: 0.15s;
        }

        @keyframes glitchIn {
            0% {
                opacity: 0;
                transform: translate(8px, -4px) skewX(10deg);
                filter: hue-rotate(90deg);
            }

            20% {
                opacity: 1;
                transform: translate(-6px, 3px) skewX(-5deg);
            }

            40% {
                transform: translate(4px, -2px) skewX(3deg);
                filter: hue-rotate(0deg);
            }

            60% {
                transform: translate(-2px, 1px) skewX(-1deg);
            }

            80% {
                transform: translate(1px, 0) skewX(0deg);
            }

            100% {
                transform: translate(0) skewX(0);
                opacity: 1;
            }
        }

        /* CRT scanline overlay for glitch variation */
        .anim-glitch::after {
            content: '';
            position: absolute;
            inset: -10px;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px,
                    rgba(0, 0, 0, 0.15) 2px, rgba(0, 0, 0, 0.15) 4px);
            pointer-events: none;
            animation: scanFlicker 0.08s infinite alternate;
        }

        @keyframes scanFlicker {
            from {
                opacity: 0.3;
            }

            to {
                opacity: 0.6;
            }
        }

        /* ── Typewriter animation (variation 3) ──────────── */
        .anim-typewriter #title-stellar {
            overflow: hidden;
            white-space: nowrap;
            width: 0;
            animation: typeIn 0.8s steps(7) 0s forwards;
            margin: 0 auto;
        }

        .anim-typewriter #title-rush {
            overflow: hidden;
            white-space: nowrap;
            width: 0;
            animation: typeIn 0.6s steps(4) 0.5s forwards;
            margin: 0 auto;
        }

        @keyframes typeIn {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        /* ── Premium button styling ───────────────────────── */
        .btn-premium {
            padding: 20px 68px;
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 6px;
            background: rgba(0, 170, 255, 0.08);
            color: #aaccff;
            border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.8s ease,
                background 0.25s, border-color 0.25s, color 0.25s;
        }

        .btn-premium:hover {
            background: rgba(0, 170, 255, 0.18);
            border-color: rgba(0, 170, 255, 0.7);
            color: #fff;
            text-shadow: 0 0 14px #0af;
        }

        .menu-btn-base {
            position: absolute;
            opacity: 0;
            z-index: 60;
        }

        .menu-btn-base.visible {
            opacity: 1;
        }

        /* Play button alignment variants */
        .align-left {
            left: 20%;
            top: 50%;
            transform: translateY(-50%);
        }

        .align-left.visible {
            transform: translateY(-50%);
        }

        .align-far-left {
            left: 8%;
            top: 50%;
            transform: translateY(-50%);
        }

        .align-far-left.visible {
            transform: translateY(-50%);
        }

        .align-bottom-left {
            left: 12%;
            bottom: 20%;
            top: auto;
        }

        .align-center-left {
            left: 20%;
            top: 50%;
            transform: translateY(-50%);
        }

        .align-center-left.visible {
            transform: translateY(-50%);
        }

        /* Skip button */
        #skip-intro {
            position: absolute;
            bottom: 30px;
            right: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.3s ease, opacity 0.3s ease;
            display: none;
            z-index: 100;
        }

        #skip-intro:hover {
            color: rgba(255, 255, 255, 1);
        }
    </style>
</head>

<body>
    <!-- HUD (during gameplay) -->
    <div id="hud" class="hidden">
        <div id="score">0</div>
        <div id="fuel-wrap">
            <div id="fuel-bar"></div>
        </div>
        <div id="boost-indicator">▸ BOOST</div>
        <div id="shield-indicator">◆ SHIELD</div>
    </div>

    <!-- Menu button (top-right during gameplay) -->
    <div id="menu-btn">
        <svg viewBox="0 0 24 24">
            <line x1="4" y1="6" x2="20" y2="6" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="18" x2="20" y2="18" />
        </svg>
    </div>

    <!-- Main Menu overlay (title + play) -->
    <div id="main-menu">
        <div id="title-container">
            <div id="title-wrap">
                <span id="title-stellar">STELLAR</span>
                <span id="title-rush">RUSH</span>
            </div>
        </div>
        <button id="play-btn" class="btn-premium menu-btn-base">PLAY</button>

        <div id="skip-intro">Click to Skip</div>
    </div>

    <!-- Pause overlay -->
    <div id="pause-menu">
        <div class="pause-inner">
            <h2>PAUSED</h2>
            <div class="pause-btns">
                <button id="pause-resume-btn" class="btn-premium">RESUME</button>
                <button id="pause-back-btn" class="btn-premium">BACK TO MAIN MENU</button>
            </div>
        </div>
    </div>

    <!-- Game Over overlay -->
    <div id="game-over">
        <div>
            <h1>GAME OVER</h1>
            <div class="sub">SCORE <span id="final-score">0</span></div>
            <button id="restart-btn" class="btn-premium">RETRY</button>
        </div>
    </div>

    <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module" src="src/main.js"></script>
</body>

</html>
