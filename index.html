<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Rush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&family=Audiowide&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="src/images/icon360.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
        }

        #startup-fade {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        #world-transition-flash {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
        }

        /* ── HUD ─────────────────────────────────────────── */
        #hud {
            position: absolute;
            top: 2.04vh;
            left: 1.32vw;
            color: #fff;
            font-family: 'Courier New', monospace;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #hud.hidden {
            opacity: 0;
        }

        #credits {
            font-size: 1.85vw;
            letter-spacing: 0.13vw;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 0.66vw #0af;
        }

        #fuel-wrap {
            position: relative;
            width: 13.23vw;
            height: 1.43vh;
            margin-top: 0.81vh;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0.46vw;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #fuel-wrap.boosting {
            border-color: #f60;
            box-shadow: 0 0 0.79vw rgba(255, 100, 0, 0.5);
        }

        #fuel-bar {
            height: 100%;
            width: 100%;
            border-radius: 0.46vw;
            background: linear-gradient(90deg, #0af, #0ff);
            transition: width 0.1s linear;
            position: relative;
            z-index: 2;
        }

        #fuel-bar-boost {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #f60, #f90);
            z-index: 1;
            transition: width 0.1s linear;
            border-radius: 0.46vw;
            opacity: 0;
        }

        #fuel-bar.low {
            animation: pulse-fuel 0.4s infinite;
        }

        @keyframes pulse-fuel {
            50% {
                opacity: 0.5;
            }
        }

        #boost-indicator {
            font-size: 0.73vw;
            color: #0ff;
            margin-top: 0.41vh;
            letter-spacing: 0.2vw;
            opacity: 0;
            transition: opacity 0.15s;
        }

        #shield-indicator {
            font-size: 0.73vw;
            color: #33aaff;
            margin-top: 0.2vh;
            letter-spacing: 0.2vw;
            opacity: 0;
            transition: opacity 0.15s;
        }

        /* ── Mobile Controls ─────────────────────────────── */
        #mobile-controls {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease;
        }

        #mobile-controls.visible {
            opacity: 1;
            visibility: visible;
        }

        #mobile-boost-btn {
            position: absolute;
            bottom: 4.07vh;
            left: 2.65vw;
            width: 7.94vw;
            height: 7.94vw;
            border-radius: 50%;
            background: rgba(0, 170, 255, 0.05);
            border: 2px solid rgba(0, 170, 255, 0.3);
            color: #0af;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.93vw;
            font-weight: 700;
            letter-spacing: 0.2vw;
            pointer-events: auto;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 1.32vw rgba(0, 170, 255, 0.15), inset 0 0 0.99vw rgba(0, 170, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(1px);
            text-shadow: 0 0 0.66vw rgba(0, 170, 255, 0.5);
        }

        #mobile-boost-btn.active {
            background: rgba(255, 100, 0, 0.2);
            border-color: #f60;
            color: #fff;
            transform: scale(0.9);
            box-shadow: 0 0 2.65vw rgba(255, 100, 0, 0.5), inset 0 0 1.32vw rgba(255, 100, 0, 0.2);
            text-shadow: 0 0 0.99vw #f60;
        }

        #mobile-joystick-zone {
            position: absolute;
            bottom: 4.07vh;
            right: 2.65vw;
            width: 14.55vw;
            height: 14.55vw;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mobile-joystick-base {
            width: 14.55vw;
            height: 14.55vw;
            border-radius: 50%;
            background: rgba(0, 170, 255, 0.05);
            border: 2px solid rgba(0, 170, 255, 0.3);
            box-shadow: 0 0 1.32vw rgba(0, 170, 255, 0.15), inset 0 0 0.99vw rgba(0, 170, 255, 0.1);
            backdrop-filter: blur(1px);
            position: relative;
        }

        #mobile-joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5.29vw;
            height: 5.29vw;
            margin-top: -2.65vw;
            margin-left: -2.65vw;
            border-radius: 50%;
            background: rgba(0, 170, 255, 0.4);
            border: 2px solid rgba(0, 170, 255, 0.8);
            box-shadow: 0 0 0.99vw rgba(0, 170, 255, 0.5);
            pointer-events: none;
            transition: background 0.2s, box-shadow 0.2s;
        }

        #mobile-joystick-zone.active #mobile-joystick-stick {
            background: rgba(0, 170, 255, 0.7);
            box-shadow: 0 0 1.65vw rgba(0, 170, 255, 0.8);
        }

        /* ── Game Over overlay ────────────────────────────── */
        #game-over {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            background: rgba(0, 0, 0, 0.75);
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            text-align: center;
        }

        #game-over.show {
            display: grid;
        }

        #game-over h1 {
            font-size: 3.44vw;
            color: #f43;
            letter-spacing: 0.4vw;
        }

        #game-over .sub {
            font-size: 1.46vw;
            margin-top: 0.81vh;
            color: #aaa;
        }

        #game-over button {
            display: block;
            width: 100%;
            margin-top: 1.53vh;
        }

        #game-over button:first-of-type {
            margin-top: 2.85vh;
        }

        /* ── Menu button (top-right during gameplay) ──────── */
        #menu-btn {
            position: absolute;
            top: 1.83vh;
            right: 1.32vw;
            width: 2.91vw;
            height: 2.91vw;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0.53vw;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
            z-index: 100;
        }

        #menu-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        #menu-btn.visible {
            display: flex;
        }

        #menu-btn svg {
            width: 1.46vw;
            height: 1.46vw;
        }

        #menu-btn svg line {
            stroke: #ccc;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* ── Pause overlay ────────────────────────────────── */
        #pause-menu {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            background: rgba(0, 0, 5, 0.78);
            z-index: 200;
            font-family: 'Orbitron', 'Courier New', monospace;
        }

        #pause-menu.show {
            display: grid;
        }

        #pause-menu .pause-inner {
            text-align: center;
        }

        #pause-menu h2 {
            font-size: 2.38vw;
            color: #ffffff;
            letter-spacing: 0.4vw;
            text-shadow: 0 0 1.32vw rgba(0, 170, 255, 0.5);
            margin-bottom: 4.07vh;
        }

        #pause-menu button {
            padding: 1.43vh 2.91vw;
            font-family: 'Orbitron', monospace;
            font-size: 0.99vw;
            letter-spacing: 0.2vw;
            background: transparent;
            color: #aaccff;
            border: 1px solid rgba(0, 170, 255, 0.35);
            border-radius: 0.4vw;
            cursor: pointer;
            transition: all 0.25s;
        }

        #pause-menu button:hover {
            background: rgba(0, 170, 255, 0.12);
            border-color: rgba(0, 170, 255, 0.7);
            color: #fff;
            text-shadow: 0 0 0.66vw #0af;
        }

        .pause-btns {
            display: flex;
            flex-direction: column;
            gap: 1.53vh;
            align-items: center;
        }

        .pause-btns .btn-premium {
            width: 21.16vw;
            padding: 1.63vh 0;
            font-size: 0.93vw;
        }

        /* ── Settings Section ─────────────────────────────── */
        #graphics-settings {
            margin-top: 4.07vh;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 170, 255, 0.2);
            border-radius: 0.53vw;
            padding: 1.32vw;
            text-align: left;
            width: 21.16vw;
            margin-left: auto;
            margin-right: auto;
        }

        #graphics-settings h3 {
            color: #aaccff;
            font-size: 1.06vw;
            letter-spacing: 0.13vw;
            margin-bottom: 1.53vh;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1.02vh;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.53vh;
            font-family: 'Courier New', monospace;
            color: #ddd;
            font-size: 0.93vw;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-row select {
            background: #112;
            color: #fff;
            border: 1px solid #0af;
            padding: 0.41vh 0.53vw;
            font-family: 'Courier New', monospace;
            border-radius: 0.26vw;
            outline: none;
            cursor: pointer;
        }

        .setting-row input[type="checkbox"] {
            transform: scale(1.2);
            cursor: pointer;
        }

        #notification-overlay {
            position: absolute;
            top: 6.11vh;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.06vw;
            letter-spacing: 0.13vw;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-shadow: 0 0 0.66vw #0af;
            z-index: 1000;
        }

        #notification-overlay.show {
            opacity: 1;
        }

        /* ── Main Menu overlay ────────────────────────────── */
        #main-menu {
            position: absolute;
            inset: 0;
            display: none;
            z-index: 50;
            pointer-events: none;
        }

        /* ── Title container ──────────────────────────────── */
        #title-container {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translate(-50%, 2.04vh);
            opacity: 0;
            transition: opacity 1.0s ease, transform 1.0s ease;
            text-align: center;
            pointer-events: none;
        }

        #title-container.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        #title-stellar,
        #title-rush {
            display: block;
            font-weight: 900;
            line-height: 1.1;
        }

        #title-rush {
            margin-top: 0.41vh;
        }

        /* ── Slide-glow animation (variation 1) ──────────── */
        .anim-slide-glow #title-stellar {
            animation: slideFromLeft 1s ease-out forwards;
        }

        .anim-slide-glow #title-rush {
            animation: slideFromRight 1s 0.2s ease-out both;
        }

        @keyframes slideFromLeft {
            from {
                transform: translateX(-5.29vw);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideFromRight {
            from {
                transform: translateX(5.29vw);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ── Glitch animation (variation 2) ──────────────── */
        .anim-glitch #title-stellar,
        .anim-glitch #title-rush {
            animation: glitchIn 0.6s steps(8) both;
            position: relative;
        }

        .anim-glitch #title-rush {
            animation-delay: 0.15s;
        }

        @keyframes glitchIn {
            0% {
                opacity: 0;
                transform: translate(0.53vw, -0.41vh) skewX(10deg);
                filter: hue-rotate(90deg);
            }

            20% {
                opacity: 1;
                transform: translate(-0.4vw, 0.31vh) skewX(-5deg);
            }

            40% {
                transform: translate(0.26vw, -0.2vh) skewX(3deg);
                filter: hue-rotate(0deg);
            }

            60% {
                transform: translate(-0.13vw, 0.1vh) skewX(-1deg);
            }

            80% {
                transform: translate(0.07vw, 0) skewX(0deg);
            }

            100% {
                transform: translate(0) skewX(0);
                opacity: 1;
            }
        }

        /* CRT scanline overlay for glitch variation */
        .anim-glitch::after {
            content: '';
            position: absolute;
            inset: -0.66vw;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px,
                    rgba(0, 0, 0, 0.15) 2px, rgba(0, 0, 0, 0.15) 4px);
            pointer-events: none;
            animation: scanFlicker 0.08s infinite alternate;
        }

        @keyframes scanFlicker {
            from {
                opacity: 0.3;
            }

            to {
                opacity: 0.6;
            }
        }

        /* ── Typewriter animation (variation 3) ──────────── */
        .anim-typewriter #title-stellar {
            overflow: hidden;
            white-space: nowrap;
            width: 0;
            animation: typeIn 0.8s steps(7) 0s forwards;
            margin: 0 auto;
        }

        .anim-typewriter #title-rush {
            overflow: hidden;
            white-space: nowrap;
            width: 0;
            animation: typeIn 0.6s steps(4) 0.5s forwards;
            margin: 0 auto;
        }

        @keyframes typeIn {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        /* ── Premium button styling ───────────────────────── */
        .btn-premium {
            padding: 2.04vh 4.5vw;
            font-family: 'Orbitron', monospace;
            font-size: 1.46vw;
            font-weight: 700;
            letter-spacing: 0.4vw;
            background: rgba(0, 170, 255, 0.08);
            color: #aaccff;
            border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 0.53vw;
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.8s ease,
                background 0.25s, border-color 0.25s, color 0.25s;
        }

        .btn-premium:hover,
        .btn-premium.focused {
            background: rgba(0, 170, 255, 0.25);
            border-color: #0af;
            color: #fff;
            text-shadow: 0 0 0.93vw #0af;
            box-shadow: 0 0 1.65vw rgba(0, 170, 255, 0.4), inset 0 0 0.66vw rgba(0, 170, 255, 0.3);
            outline: none;
        }

        @keyframes focusPulse {
            from {
                box-shadow: 0 0 1.32vw rgba(0, 170, 255, 0.45), inset 0 0 0.33vw rgba(0, 170, 255, 0.2);
            }

            to {
                box-shadow: 0 0 2.12vw rgba(0, 170, 255, 0.75), inset 0 0 0.79vw rgba(0, 170, 255, 0.4);
            }
        }

        .btn-premium.focused {
            animation: focusPulse 2.5s infinite alternate ease-in-out;
            border-color: #0ff;
        }

        #menu-actions {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 2.04vh;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 100;
            pointer-events: none;
        }

        #menu-actions.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #menu-actions.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .menu-btn-base {
            width: 18.52vw;
            height: 6.11vh;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.19vw;
            letter-spacing: 0.26vw;
            cursor: pointer;
            background: rgba(0, 170, 255, 0.1);
            border: 1px solid #0af;
            color: #0af;
            transition: background 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Play button alignment variants */
        .align-left {
            left: 15%;
            top: 50%;
            transform: translateY(-50%);
        }

        .align-left.visible {
            transform: translateY(-50%);
        }

        .align-far-left {
            left: 8%;
            top: 50%;
            transform: translateY(-50%);
        }

        .align-far-left.visible {
            transform: translateY(-50%);
        }

        .align-bottom-left {
            left: 12%;
            bottom: 20%;
            top: auto;
        }

        .align-center-left {
            left: 20%;
            top: 50%;
            transform: translateY(-50%);
        }

        .align-center-left.visible {
            transform: translateY(-50%);
        }

        /* Skip button */
        #skip-intro {
            position: absolute;
            bottom: 3.05vh;
            right: 2.65vw;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.93vw;
            letter-spacing: 0.13vw;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.3s ease, opacity 0.3s ease;
            display: none;
            z-index: 100;
        }



        #skip-intro:hover {
            color: rgba(255, 255, 255, 1);
        }

        /* ── World Select overlay ────────────────────────── */
        #world-select {
            position: absolute;
            inset: 0;
            display: none;
            background: rgba(0, 0, 5, 0.88);
            z-index: 60;
            font-family: 'Orbitron', sans-serif;
            justify-content: center;
            align-items: center;
        }

        .world-select-inner {
            text-align: center;
        }

        .world-select-title {
            font-size: 2.4vw;
            color: #fff;
            letter-spacing: 0.5vw;
            text-shadow: 0 0 1.5vw rgba(0, 170, 255, 0.5);
            margin-bottom: 4vh;
        }

        .world-btn-row {
            display: flex;
            gap: 2vw;
            justify-content: center;
        }

        .world-btn {
            width: 16vw;
            padding: 3vh 1.5vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
            position: relative;
            cursor: pointer;
        }

        .world-btn .world-name {
            font-size: 1.3vw;
            font-weight: 700;
            letter-spacing: 0.3vw;
        }

        .world-btn .world-sub {
            font-size: 0.75vw;
            color: rgba(170, 200, 255, 0.7);
            letter-spacing: 0.15vw;
            text-transform: uppercase;
        }

        .world-btn .lock-icon {
            font-size: 1.6vw;
            filter: grayscale(1) brightness(0.6);
        }

        .world-btn.locked {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        .world-btn:not(.locked):hover .world-sub {
            color: #fff;
        }

        /* ── Upgrades Menu ────────────────────────────────── */
        #upgrades-menu {
            position: absolute;
            inset: 0;
            z-index: 150;
            perspective: 79.37vw;
            pointer-events: none;
            /* Let clicks pass to screens */
        }

        #upgrades-menu>button,
        #upgrades-menu>div#upgrades-bank {
            pointer-events: auto;
        }

        .cockpit-screens {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 2%;
            pointer-events: none;
        }

        .top-screens {
            display: flex;
            width: 90%;
            max-width: 92.59vw;
            justify-content: space-between;
            margin-bottom: 2.04vh;
        }

        .joystick-space {
            width: 20%;
            /* Space for the 3D joystick */
        }

        .bottom-screen {
            width: 90%;
            max-width: 92.59vw;
        }

        .cockpit-screen {
            background: rgba(0, 20, 40, 0.7);
            border: 2px solid #0af;
            border-radius: 0.79vw;
            box-shadow: 0 0 1.98vw rgba(0, 170, 255, 0.2) inset, 0 0 1.32vw rgba(0, 170, 255, 0.4);
            backdrop-filter: blur(8px);
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        /* 3D tilts for screens to look like they surround the pilot */
        #screen-active {
            flex: 1;
            aspect-ratio: 16/9;
            transform: rotateY(-15deg) rotateX(10deg);
            transform-origin: right bottom;
        }

        #screen-info {
            flex: 1;
            aspect-ratio: 16/9;
            transform: rotateY(15deg) rotateX(10deg);
            transform-origin: left bottom;
            display: flex;
            flex-direction: column;
        }

        #screen-available {
            width: 100%;
            aspect-ratio: 32/9;
            transform: rotateX(25deg);
            transform-origin: bottom center;
            display: flex;
            flex-direction: row;
        }

        .category-sidebar {
            width: 100%;
            background: rgba(0, 10, 25, 0.9);
            display: flex;
            flex-direction: column;
            gap: 1.53vh;
            padding: 1.32vw;
            justify-content: center;
        }



        .cat-btn {
            background: rgba(0, 170, 255, 0.1);
            border: 1px solid rgba(0, 170, 255, 0.3);
            color: #0af;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.93vw;
            padding: 1.53vh;
            cursor: pointer;
            border-radius: 0.26vw;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .cat-btn:hover {
            background: rgba(0, 170, 255, 0.3);
            color: #fff;
        }

        .cat-btn.active {
            background: rgba(0, 170, 255, 0.5);
            border-color: #0ff;
            color: #fff;
            box-shadow: 0 0 0.66vw rgba(0, 255, 255, 0.4);
        }

        .screen-title {
            background: rgba(0, 170, 255, 0.2);
            color: #0ff;
            text-align: center;
            padding: 0.81vh;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 0.26vw;
            border-bottom: 1px solid #0af;
            font-size: 0.93vw;
        }

        /* Grids */
        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(6, 3.97vw);
            grid-template-rows: repeat(3, 3.97vw);
            gap: 0.26vw;
            padding: 0.66vw;
            height: calc(100% - 2.32vw);
            box-sizing: border-box;
            position: relative;
            justify-content: center;
            align-content: center;
        }

        .grid-cell {
            background: rgba(0, 170, 255, 0.05);
            border: 1px dashed rgba(0, 170, 255, 0.3);
            border-radius: 0.26vw;
            position: relative;
            transition: background 0.2s, border-color 0.2s;
        }

        .grid-cell.drag-over {
            background: rgba(0, 255, 100, 0.2);
            border-color: #0f5;
        }

        .grid-cell.drag-invalid {
            background: rgba(255, 50, 50, 0.2);
            border-color: #f55;
        }

        .available-list-col {
            display: grid;
            grid-template-columns: repeat(4, 3.97vw);
            grid-auto-rows: 3.97vw;
            gap: 0.26vw;
            padding: 0.66vw;
            overflow-y: auto;
            height: calc(100% - 2.32vw);
            justify-content: center;
        }

        /* Upgrade Item */
        .upgrade-container {
            position: relative;
            display: flex;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .upgrade-item {
            position: relative;
            border-radius: 0.4vw;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.79vw;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            flex-shrink: 0;
            overflow: hidden;
        }

        .upgrade-item:not(.owned)::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 0;
        }

        .upgrade-item>* {
            position: relative;
            z-index: 1;
        }

        .upgrade-name {
            padding: 0.33vw;
            font-weight: 700;
            text-shadow: 0 0 0.33vw rgba(0, 0, 0, 0.8);
        }

        .upgrade-item-cost {
            position: absolute;
            bottom: 0.26vw;
            right: 0.4vw;
            font-size: 0.66vw;
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
        }

        .monochrome-emoji {
            filter: grayscale(1) brightness(1.2) contrast(1.1);
        }

        .upgrade-item:active {
            cursor: grabbing;
        }



        .upgrade-item.owned {
            /* Full opacity for owned items */
        }

        /* Engine: yellow (#ffcc00) */
        .upgrade-item.engine {
            background: linear-gradient(135deg, rgba(255, 204, 0, 1), rgba(200, 150, 0, 1));
            border: 1px solid #fc0;
            box-shadow: 0 0 0.66vw rgba(255, 204, 0, 0.3);
        }

        .upgrade-item.engine:hover {
            box-shadow: 0 0 1.32vw rgba(255, 204, 0, 0.6);
            transform: scale(1.02);
        }

        /* Economy: green (#22ff66) */
        .upgrade-item.economy {
            background: linear-gradient(135deg, rgba(34, 255, 102, 1), rgba(0, 180, 50, 1));
            border: 1px solid #2f6;
            box-shadow: 0 0 0.66vw rgba(34, 255, 102, 0.3);
        }

        .upgrade-item.economy:hover {
            box-shadow: 0 0 1.32vw rgba(34, 255, 102, 0.6);
            transform: scale(1.02);
        }

        /* Defense: blue (#33aaff) */
        .upgrade-item.defense {
            background: linear-gradient(135deg, rgba(51, 170, 255, 1), rgba(0, 100, 200, 1));
            border: 1px solid #3af;
            box-shadow: 0 0 0.66vw rgba(51, 170, 255, 0.3);
        }

        .upgrade-item.defense:hover {
            box-shadow: 0 0 1.32vw rgba(51, 170, 255, 0.6);
            transform: scale(1.02);
        }

        .selected {
            border-width: 3px !important;
            border-color: #0ff !important;
            box-shadow: 0 0 0.99vw rgba(0, 255, 255, 0.6) !important;
            z-index: 10;
        }

        .upgrade-placeholder {
            border: 1px dashed rgba(0, 170, 255, 0.2);
            border-radius: 0.4vw;
            background: rgba(0, 170, 255, 0.05);
            flex-shrink: 0;
        }

        /* Shape sizes (based on a base unit size, dynamically applied via JS depending on grid cell size) */

        #info-content {
            padding: 1.32vw;
            flex: 1;
            display: flex;
            flex-direction: column;
            font-family: 'Courier New', monospace;
            color: #ddd;
        }

        #info-title {
            color: #0ff;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 1.02vh;
            font-size: 1.46vw;
        }

        #info-cost {
            color: #f43;
            font-weight: bold;
            margin-bottom: 2.04vh;
            font-size: 1.19vw;
        }

        #info-desc {
            flex: 1;
            font-size: 1.19vw;
            line-height: 1.4;
        }

        #info-content .btn-premium {
            padding: 1.53vh 0;
            width: 100%;
            margin-top: 2.04vh;
        }

        #info-content .btn-premium:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        #game-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }
        /* ── Play Splash Screen ───────────────────────── */
        #play-splash {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 60%, #060818 0%, #020408 55%, #000 100%);
            cursor: pointer;
            transition: opacity 0.7s ease-out;
        }

        #play-splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Animated star ring behind button */
        #play-splash::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 30% 20%, rgba(0,170,255,0.07) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(100,0,255,0.07) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0,255,255,0.04) 0%, transparent 65%);
            pointer-events: none;
        }

        /* Subtle scanline texture */
        #play-splash::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(0,0,0,0.12) 3px,
                rgba(0,0,0,0.12) 4px
            );
            pointer-events: none;
        }

        .splash-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 5vw;
            letter-spacing: 0.5vw;
            color: #fff;
            text-shadow:
                0 0 1.5vw rgba(0,170,255,0.9),
                0 0 3vw rgba(0,170,255,0.5),
                0 0 6vw rgba(0,80,200,0.3);
            margin-bottom: 0.5vh;
            animation: splashTitlePulse 3s ease-in-out infinite alternate;
            position: relative;
            z-index: 1;
        }

        .splash-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 1vw;
            letter-spacing: 0.6vw;
            color: rgba(0,200,255,0.55);
            text-transform: uppercase;
            margin-bottom: 7vh;
            position: relative;
            z-index: 1;
        }

        @keyframes splashTitlePulse {
            from { text-shadow: 0 0 1.5vw rgba(0,170,255,0.9), 0 0 3vw rgba(0,170,255,0.5), 0 0 6vw rgba(0,80,200,0.3); }
            to   { text-shadow: 0 0 2vw rgba(0,220,255,1),    0 0 4vw rgba(0,200,255,0.7), 0 0 9vw rgba(0,120,255,0.5); }
        }

        #play-splash-btn {
            position: relative;
            z-index: 1;
            padding: 2.4vh 5.5vw;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5vw;
            font-weight: 900;
            letter-spacing: 0.5vw;
            text-transform: uppercase;
            color: #e8f8ff;
            background: linear-gradient(135deg,
                rgba(0,150,255,0.15) 0%,
                rgba(0,220,255,0.08) 50%,
                rgba(0,100,200,0.15) 100%);
            border: 2px solid rgba(0,200,255,0.6);
            border-radius: 0.6vw;
            cursor: pointer;
            outline: none;
            box-shadow:
                0 0 2vw rgba(0,170,255,0.5),
                0 0 4vw rgba(0,100,255,0.3),
                inset 0 0 1vw rgba(0,200,255,0.1);
            animation: splashBtnPulse 2s ease-in-out infinite alternate;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            backdrop-filter: blur(2px);
        }

        #play-splash-btn::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 0.8vw;
            background: linear-gradient(135deg, rgba(0,200,255,0.4), transparent 50%, rgba(100,0,255,0.3));
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: xor;
            padding: 3px;
            pointer-events: none;
            opacity: 0.6;
            animation: splashBorderSpin 4s linear infinite;
        }

        @keyframes splashBorderSpin {
            from { filter: hue-rotate(0deg); }
            to   { filter: hue-rotate(360deg); }
        }

        @keyframes splashBtnPulse {
            from {
                box-shadow: 0 0 2vw rgba(0,170,255,0.5), 0 0 4vw rgba(0,100,255,0.3), inset 0 0 1vw rgba(0,200,255,0.1);
            }
            to {
                box-shadow: 0 0 3vw rgba(0,200,255,0.8), 0 0 6vw rgba(0,150,255,0.5), inset 0 0 1.5vw rgba(0,255,255,0.2);
            }
        }

        #play-splash-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg,
                rgba(0,180,255,0.25) 0%,
                rgba(0,240,255,0.15) 50%,
                rgba(0,130,220,0.25) 100%);
            box-shadow:
                0 0 3.5vw rgba(0,200,255,0.9),
                0 0 7vw rgba(0,150,255,0.6),
                inset 0 0 2vw rgba(0,255,255,0.25);
        }

        #play-splash-btn:active {
            transform: scale(0.97);
        }

        .splash-hint {
            position: absolute;
            bottom: 4vh;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75vw;
            letter-spacing: 0.3vw;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
            white-space: nowrap;
            animation: splashHintBlink 2.5s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes splashHintBlink {
            0%, 100% { opacity: 0.25; }
            50%       { opacity: 0.55; }
        }

        /* Orbit rings (decorative) */
        .splash-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0,170,255,0.12);
            pointer-events: none;
            z-index: 0;
            animation: splashRingSpin linear infinite;
        }

        .splash-ring:nth-child(1) { width: 40vw; height: 40vw; animation-duration: 18s; border-color: rgba(0,170,255,0.10); }
        .splash-ring:nth-child(2) { width: 60vw; height: 60vw; animation-duration: 30s; border-color: rgba(100,0,255,0.08); animation-direction: reverse; }
        .splash-ring:nth-child(3) { width: 80vw; height: 80vw; animation-duration: 45s; border-color: rgba(0,255,200,0.06); }

        @keyframes splashRingSpin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="game-container">

        <!-- HUD (during gameplay) -->
        <div id="hud" class="hidden">
            <div id="credits">000000</div>
            <div id="fuel-wrap">
                <div id="fuel-bar-boost"></div>
                <div id="fuel-bar"></div>
            </div>
            <div id="boost-indicator">BOOST ACTIVE</div>
            <div id="shield-indicator">SHIELD ACTIVE</div>
        </div>

        <div id="mobile-controls">
            <div id="mobile-boost-btn">BOOST</div>
            <div id="mobile-joystick-zone">
                <div id="mobile-joystick-base">
                    <div id="mobile-joystick-stick"></div>
                </div>
            </div>
        </div>

        <!-- Menu button (top-right during gameplay) -->
        <div id="menu-btn">
            <svg viewBox="0 0 24 24">
                <line x1="4" y1="6" x2="20" y2="6" />
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="18" x2="20" y2="18" />
            </svg>
        </div>

        <!-- Main Menu overlay (title + play) -->
        <div id="main-menu">
            <div id="title-container">
                <div id="title-wrap">
                    <span id="title-stellar">STELLAR</span>
                    <span id="title-rush">RUSH</span>
                </div>
            </div>
            <div id="menu-actions" class="align-left">
                <button id="play-btn" class="btn-premium menu-btn-base">PLAY</button>
                <button id="upgrades-menu-btn" class="btn-premium menu-btn-base"
                    style="margin-top: 2.04vh;">UPGRADES</button>
            </div>

            <div id="skip-intro">Click/Space to Skip</div>
        </div>

        <!-- World Select overlay (shown after clicking PLAY) -->
        <div id="world-select">
            <div class="world-select-inner">
                <h2 class="world-select-title">SELECT WORLD</h2>
                <div class="world-btn-row">
                    <button class="world-btn btn-premium" data-world="0">
                        <span class="world-name">WORLD 1</span>
                        <span class="world-sub">Deep Space</span>
                        <span class="lock-icon" style="display:none;">🔒</span>
                    </button>
                    <button class="world-btn btn-premium" data-world="1">
                        <span class="world-name">WORLD 2</span>
                        <span class="world-sub">Cloud Kingdom</span>
                        <span class="lock-icon" style="display:none;">🔒</span>
                    </button>
                    <button class="world-btn btn-premium" data-world="2" disabled>
                        <span class="world-name">WORLD 3</span>
                        <span class="world-sub">Not Yet Developed</span>
                        <span class="lock-icon">🔒</span>
                    </button>
                </div>
                <button id="world-select-back" class="btn-premium" style="margin-top: 3vh; font-size: 0.9vw; padding: 1vh 2vw;">BACK</button>
            </div>
        </div>

        <!-- Pause overlay -->
        <div id="pause-menu">
            <div class="pause-inner">
                <h2>PAUSED</h2>
                <div class="pause-btns">
                    <button id="pause-resume-btn" class="btn-premium">RESUME</button>
                    <button id="pause-back-btn" class="btn-premium">BACK TO MAIN MENU</button>
                </div>

                <div id="graphics-settings">
                    <h3>SETTINGS</h3>
                    <div class="setting-row">
                        <label for="setting-audio-vol">Audio Volume</label>
                        <input type="range" id="setting-audio-vol" min="0" max="1" step="0.05" value="1" style="width: 8vw;">
                    </div>
                    <div class="setting-row">
                        <label for="setting-music-vol">Music Volume</label>
                        <input type="range" id="setting-music-vol" min="0" max="1" step="0.05" value="1" style="width: 8vw;">
                    </div>
                    <div class="setting-row">
                        <label for="setting-preset">Graphics Preset</label>
                        <select id="setting-preset">
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label for="setting-fps">Show FPS</label>
                        <input type="checkbox" id="setting-fps">
                    </div>
                    <div class="setting-row">
                        <label for="setting-fov">Field of View</label>
                        <select id="setting-fov">
                            <option value="50">50 (Narrow)</option>
                            <option value="60">60 (Standard)</option>
                            <option value="70">70 (Wide)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over overlay -->
        <div id="game-over">
            <div>
                <h1>GAME OVER</h1>
                <div class="sub">CREDITS <span id="final-credits">0</span></div>
                <button id="restart-btn" class="btn-premium" style="width: 100%;">RETRY</button>
                <button id="upgrades-btn" class="btn-premium" style="width: 100%; margin-top: 1.02vh;">UPGRADES</button>
                <button id="game-over-back-btn" class="btn-premium" style="width: 100%; margin-top: 1.02vh;">MAIN
                    MENU</button>
            </div>
        </div>

        <!-- Upgrades Menu -->
        <div id="upgrades-menu" style="display: none;">
            <button id="upgrades-back-btn" class="btn-premium"
                style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 100; padding: 2.04vh 2.65vw; font-size: 1.32vw; min-width: 13.23vw;">EXIT</button>
            <div id="upgrades-bank"
                style="position: absolute; top: 2.04vh; left: 50%; transform: translateX(-50%); z-index: 100; text-align: center; color: #0ff; font-family: 'Orbitron', sans-serif; font-size: 1.59vw; text-shadow: 0 0 0.66vw #0af;">
                CREDITS<br /><span id="banked-credits-display">0</span>
            </div>

            <div class="cockpit-screens">
                <div class="top-screens">
                    <div id="screen-active" class="cockpit-screen">
                        <div class="screen-title">ACTIVE UPGRADES</div>
                        <div id="active-grid" class="upgrade-grid">
                            <!-- 5x3 grid cells will be injected here -->
                        </div>
                    </div>
                    <div class="joystick-space"></div>
                    <div id="screen-info" class="cockpit-screen">
                        <div class="screen-title">UPGRADE TERMINAL</div>
                        <div id="info-content">
                            <h2 id="info-title">SELECT AN UPGRADE</h2>
                            <p id="info-desc">---</p>
                            <div style="display: flex; align-items: center; gap: 0.99vw; margin-top: auto;">
                                <button id="buy-btn" class="btn-premium" disabled style="flex: 1;">BUY</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bottom-screen">
                    <div id="screen-available" class="cockpit-screen"
                        style="flex-direction: row; align-items: stretch;">
                        <div
                            style="flex: 1; display: flex; flex-direction: column; border-right: 2px solid rgba(0, 170, 255, 0.3);">
                            <div class="screen-title">ENGINE</div>
                            <div id="available-list-engine" class="available-list-col"></div>
                        </div>
                        <div
                            style="flex: 1; display: flex; flex-direction: column; border-right: 2px solid rgba(0, 170, 255, 0.3);">
                            <div class="screen-title">ECONOMY</div>
                            <div id="available-list-economy" class="available-list-col"></div>
                        </div>
                        <div style="flex: 1; display: flex; flex-direction: column;">
                            <div class="screen-title">DEFENSE</div>
                            <div id="available-list-defense" class="available-list-col"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="importmap">
    { "imports": { 
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "stats": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/stats.module.js"
    } }
    </script>
        <!-- Play Game Splash (shown before everything, ensures audio context works) -->
        <div id="play-splash">
            <div class="splash-ring"></div>
            <div class="splash-ring"></div>
            <div class="splash-ring"></div>
            <button id="play-splash-btn">▶ &nbsp;PLAY GAME</button>
            <div class="splash-hint">Click or press Space to begin</div>
        </div>

        <div id="startup-fade"></div>
    <div id="world-transition-flash"></div>

        <div id="notification-overlay"></div>

        <!-- Main Game UI -->
        <script type="module" src="src/main.js"></script>
    </div>
</body>

</html>
