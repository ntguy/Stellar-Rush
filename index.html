<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Rush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&family=Audiowide&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="src/images/icon360.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
        }

        #startup-fade {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        /* ── HUD ─────────────────────────────────────────── */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #hud.hidden {
            opacity: 0;
        }

        #credits {
            font-size: 28px;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px #0af;
        }

        #fuel-wrap {
            width: 200px;
            height: 14px;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        #fuel-bar {
            height: 100%;
            width: 100%;
            border-radius: 7px;
            background: linear-gradient(90deg, #0af, #0ff);
            transition: width 0.1s linear;
        }

        #fuel-bar.low {
            animation: pulse-fuel 0.4s infinite;
        }

        @keyframes pulse-fuel {
            50% {
                opacity: 0.5;
            }
        }

        #boost-indicator {
            font-size: 11px;
            color: #0ff;
            margin-top: 4px;
            letter-spacing: 3px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        #shield-indicator {
            font-size: 11px;
            color: #33aaff;
            margin-top: 2px;
            letter-spacing: 3px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        /* ── Game Over overlay ────────────────────────────── */
        #game-over {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            background: rgba(0, 0, 0, 0.75);
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            text-align: center;
        }

        #game-over.show {
            display: grid;
        }

        #game-over h1 {
            font-size: 52px;
            color: #f43;
            letter-spacing: 6px;
        }

        #game-over .sub {
            font-size: 22px;
            margin-top: 8px;
            color: #aaa;
        }

        #game-over button {
            display: block;
            width: 100%;
            margin-top: 15px;
        }
        #game-over button:first-of-type {
            margin-top: 28px;
        }

        /* ── Menu button (top-right during gameplay) ──────── */
        #menu-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
            z-index: 100;
        }

        #menu-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        #menu-btn.visible {
            display: flex;
        }

        #menu-btn svg {
            width: 22px;
            height: 22px;
        }

        #menu-btn svg line {
            stroke: #ccc;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* ── Pause overlay ────────────────────────────────── */
        #pause-menu {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            background: rgba(0, 0, 5, 0.78);
            z-index: 200;
            font-family: 'Orbitron', 'Courier New', monospace;
        }

        #pause-menu.show {
            display: grid;
        }

        #pause-menu .pause-inner {
            text-align: center;
        }

        #pause-menu h2 {
            font-size: 36px;
            color: #ffffff;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(0, 170, 255, 0.5);
            margin-bottom: 40px;
        }

        #pause-menu button {
            padding: 14px 44px;
            font-family: 'Orbitron', monospace;
            font-size: 15px;
            letter-spacing: 3px;
            background: transparent;
            color: #aaccff;
            border: 1px solid rgba(0, 170, 255, 0.35);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s;
        }

        #pause-menu button:hover {
            background: rgba(0, 170, 255, 0.12);
            border-color: rgba(0, 170, 255, 0.7);
            color: #fff;
            text-shadow: 0 0 10px #0af;
        }

        .pause-btns {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .pause-btns .btn-premium {
            width: 320px;
            padding: 16px 0;
            font-size: 14px;
        }

        /* ── Settings Section ─────────────────────────────── */
        #graphics-settings {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 170, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        #graphics-settings h3 {
            color: #aaccff;
            font-size: 16px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            color: #ddd;
            font-size: 14px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-row select {
            background: #112;
            color: #fff;
            border: 1px solid #0af;
            padding: 4px 8px;
            font-family: 'Courier New', monospace;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .setting-row input[type="checkbox"] {
            transform: scale(1.2);
            cursor: pointer;
        }

        /* ── Main Menu overlay ────────────────────────────── */
        #main-menu {
            position: absolute;
            inset: 0;
            display: none;
            z-index: 50;
            pointer-events: none;
        }

        /* ── Title container ──────────────────────────────── */
        #title-container {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translate(-50%, 20px);
            opacity: 0;
            transition: opacity 1.0s ease, transform 1.0s ease;
            text-align: center;
            pointer-events: none;
        }

        #title-container.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        #title-stellar,
        #title-rush {
            display: block;
            font-weight: 900;
            line-height: 1.1;
        }

        #title-rush {
            margin-top: 4px;
        }

        /* ── Slide-glow animation (variation 1) ──────────── */
        .anim-slide-glow #title-stellar {
            animation: slideFromLeft 1s ease-out forwards;
        }

        .anim-slide-glow #title-rush {
            animation: slideFromRight 1s 0.2s ease-out both;
        }

        @keyframes slideFromLeft {
            from {
                transform: translateX(-80px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideFromRight {
            from {
                transform: translateX(80px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ── Glitch animation (variation 2) ──────────────── */
        .anim-glitch #title-stellar,
        .anim-glitch #title-rush {
            animation: glitchIn 0.6s steps(8) both;
            position: relative;
        }

        .anim-glitch #title-rush {
            animation-delay: 0.15s;
        }

        @keyframes glitchIn {
            0% {
                opacity: 0;
                transform: translate(8px, -4px) skewX(10deg);
                filter: hue-rotate(90deg);
            }

            20% {
                opacity: 1;
                transform: translate(-6px, 3px) skewX(-5deg);
            }

            40% {
                transform: translate(4px, -2px) skewX(3deg);
                filter: hue-rotate(0deg);
            }

            60% {
                transform: translate(-2px, 1px) skewX(-1deg);
            }

            80% {
                transform: translate(1px, 0) skewX(0deg);
            }

            100% {
                transform: translate(0) skewX(0);
                opacity: 1;
            }
        }

        /* CRT scanline overlay for glitch variation */
        .anim-glitch::after {
            content: '';
            position: absolute;
            inset: -10px;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px,
                    rgba(0, 0, 0, 0.15) 2px, rgba(0, 0, 0, 0.15) 4px);
            pointer-events: none;
            animation: scanFlicker 0.08s infinite alternate;
        }

        @keyframes scanFlicker {
            from {
                opacity: 0.3;
            }

            to {
                opacity: 0.6;
            }
        }

        /* ── Typewriter animation (variation 3) ──────────── */
        .anim-typewriter #title-stellar {
            overflow: hidden;
            white-space: nowrap;
            width: 0;
            animation: typeIn 0.8s steps(7) 0s forwards;
            margin: 0 auto;
        }

        .anim-typewriter #title-rush {
            overflow: hidden;
            white-space: nowrap;
            width: 0;
            animation: typeIn 0.6s steps(4) 0.5s forwards;
            margin: 0 auto;
        }

        @keyframes typeIn {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        /* ── Premium button styling ───────────────────────── */
        .btn-premium {
            padding: 20px 68px;
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 6px;
            background: rgba(0, 170, 255, 0.08);
            color: #aaccff;
            border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.8s ease,
                background 0.25s, border-color 0.25s, color 0.25s;
        }

        .btn-premium:hover {
            background: rgba(0, 170, 255, 0.18);
            border-color: rgba(0, 170, 255, 0.7);
            color: #fff;
            text-shadow: 0 0 14px #0af;
        }

        #menu-actions {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.6s, transform 0.6s;
            z-index: 100;
            pointer-events: none;
        }

        #menu-actions.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .menu-btn-base {
            width: 280px;
            height: 60px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            letter-spacing: 4px;
            cursor: pointer;
            background: rgba(0, 170, 255, 0.1);
            border: 1px solid #0af;
            color: #0af;
            transition: background 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Play button alignment variants */
        .align-left {
            left: 20%;
            top: 50%;
            transform: translateY(-50%);
        }

        .align-left.visible {
            transform: translateY(-50%);
        }

        .align-far-left {
            left: 8%;
            top: 50%;
            transform: translateY(-50%);
        }

        .align-far-left.visible {
            transform: translateY(-50%);
        }

        .align-bottom-left {
            left: 12%;
            bottom: 20%;
            top: auto;
        }

        .align-center-left {
            left: 20%;
            top: 50%;
            transform: translateY(-50%);
        }

        .align-center-left.visible {
            transform: translateY(-50%);
        }

        /* Skip button */
        #skip-intro {
            position: absolute;
            bottom: 30px;
            right: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.3s ease, opacity 0.3s ease;
            display: none;
            z-index: 100;
        }



        #skip-intro:hover {
            color: rgba(255, 255, 255, 1);
        }

        /* ── Upgrades Menu ────────────────────────────────── */
        #upgrades-menu {
            position: absolute;
            inset: 0;
            z-index: 150;
            perspective: 1200px;
            pointer-events: none; /* Let clicks pass to screens */
        }
        
        #upgrades-menu > button, #upgrades-menu > div#upgrades-bank {
            pointer-events: auto;
        }

        .cockpit-screens {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 2%;
            pointer-events: none;
        }

        .top-screens {
            display: flex;
            width: 90%;
            max-width: 1400px;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .joystick-space {
            width: 20%; /* Space for the 3D joystick */
        }

        .bottom-screen {
            width: 90%;
            max-width: 1400px;
        }

        .cockpit-screen {
            background: rgba(0, 20, 40, 0.7);
            border: 2px solid #0af;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.2) inset, 0 0 20px rgba(0, 170, 255, 0.4);
            backdrop-filter: blur(8px);
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        /* 3D tilts for screens to look like they surround the pilot */
        #screen-active {
            flex: 1;
            aspect-ratio: 16/9;
            transform: rotateY(-15deg) rotateX(10deg);
            transform-origin: right bottom;
        }

        #screen-info {
            flex: 1;
            aspect-ratio: 16/9;
            transform: rotateY(15deg) rotateX(10deg);
            transform-origin: left bottom;
            display: flex;
            flex-direction: column;
        }

        #screen-available {
            width: 100%;
            aspect-ratio: 32/9;
            transform: rotateX(25deg);
            transform-origin: bottom center;
            display: flex;
            flex-direction: row;
        }

        .category-sidebar {
            width: 100%;
            background: rgba(0, 10, 25, 0.9);
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            justify-content: center;
        }



        .cat-btn {
            background: rgba(0, 170, 255, 0.1);
            border: 1px solid rgba(0, 170, 255, 0.3);
            color: #0af;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            padding: 15px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .cat-btn:hover {
            background: rgba(0, 170, 255, 0.3);
            color: #fff;
        }

        .cat-btn.active {
            background: rgba(0, 170, 255, 0.5);
            border-color: #0ff;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
        }

        .screen-title {
            background: rgba(0, 170, 255, 0.2);
            color: #0ff;
            text-align: center;
            padding: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 4px;
            border-bottom: 1px solid #0af;
            font-size: 14px;
        }

        /* Grids */
        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 4px;
            padding: 10px;
            height: calc(100% - 35px);
            box-sizing: border-box;
            position: relative;
            justify-content: center;
            align-content: center;
        }

        .grid-cell {
            background: rgba(0, 170, 255, 0.05);
            border: 1px dashed rgba(0, 170, 255, 0.3);
            border-radius: 4px;
            position: relative;
            transition: background 0.2s, border-color 0.2s;
        }

        .grid-cell.drag-over {
            background: rgba(0, 255, 100, 0.2);
            border-color: #0f5;
        }

        .grid-cell.drag-invalid {
            background: rgba(255, 50, 50, 0.2);
            border-color: #f55;
        }

        #available-list {
            display: flex;
            gap: 15px;
            padding: 20px;
            overflow-x: auto;
            height: calc(100% - 35px);
            align-items: flex-start;
        }

        /* Upgrade Item */
        .upgrade-container {
            position: relative;
            display: flex;
            justify-content: center;
            width: fit-content;
            margin-bottom: 25px;
        }

        .upgrade-item {
            border-radius: 6px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            flex-shrink: 0;

            /* Unpurchased state: 50% transparent, darker */
            opacity: 0.5;
            filter: brightness(0.6);
        }

        .upgrade-item:active {
            cursor: grabbing;
        }

        .upgrade-cost-tag {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: #0af;
            text-shadow: 0 0 5px rgba(0, 170, 255, 0.5);
        }

        .upgrade-item.owned {
            opacity: 1;
            filter: brightness(1);
        }

        /* Engine: yellow (#ffcc00) */
        .upgrade-item.engine {
            background: linear-gradient(135deg, rgba(255, 204, 0, 1), rgba(200, 150, 0, 1));
            border: 1px solid #fc0;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }
        .upgrade-item.engine:hover {
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
            transform: scale(1.02);
        }

        /* Economy: green (#22ff66) */
        .upgrade-item.economy {
            background: linear-gradient(135deg, rgba(34, 255, 102, 1), rgba(0, 180, 50, 1));
            border: 1px solid #2f6;
            box-shadow: 0 0 10px rgba(34, 255, 102, 0.3);
        }
        .upgrade-item.economy:hover {
            box-shadow: 0 0 20px rgba(34, 255, 102, 0.6);
            transform: scale(1.02);
        }

        /* Defense: blue (#33aaff) */
        .upgrade-item.defense {
            background: linear-gradient(135deg, rgba(51, 170, 255, 1), rgba(0, 100, 200, 1));
            border: 1px solid #3af;
            box-shadow: 0 0 10px rgba(51, 170, 255, 0.3);
        }
        .upgrade-item.defense:hover {
            box-shadow: 0 0 20px rgba(51, 170, 255, 0.6);
            transform: scale(1.02);
        }

        /* Shape sizes (based on a base unit size, dynamically applied via JS depending on grid cell size) */
        
        #info-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            font-family: 'Courier New', monospace;
            color: #ddd;
        }

        #info-title {
            color: #0ff;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 10px;
            font-size: 22px;
        }

        #info-cost {
            color: #f43;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 18px;
        }

        #info-desc {
            flex: 1;
            font-size: 16px;
            line-height: 1.4;
        }

        #info-content .btn-premium {
            padding: 15px 0;
            width: 100%;
            margin-top: 20px;
        }

        #info-content .btn-premium:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- HUD (during gameplay) -->
    <div id="hud" class="hidden">
        <div id="credits">0</div>
        <div id="fuel-wrap">
            <div id="fuel-bar"></div>
        </div>
        <div id="boost-indicator">▸ BOOST</div>
        <div id="shield-indicator">◆ SHIELD</div>
    </div>

    <!-- Menu button (top-right during gameplay) -->
    <div id="menu-btn">
        <svg viewBox="0 0 24 24">
            <line x1="4" y1="6" x2="20" y2="6" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="18" x2="20" y2="18" />
        </svg>
    </div>

    <!-- Main Menu overlay (title + play) -->
    <div id="main-menu">
        <div id="title-container">
            <div id="title-wrap">
                <span id="title-stellar">STELLAR</span>
                <span id="title-rush">RUSH</span>
            </div>
        </div>
        <div id="menu-actions" class="align-left">
            <button id="play-btn" class="btn-premium menu-btn-base">PLAY</button>
            <button id="upgrades-menu-btn" class="btn-premium menu-btn-base" style="margin-top: 20px;">UPGRADES</button>
        </div>

        <div id="skip-intro">Click to Skip</div>
    </div>

    <!-- Pause overlay -->
    <div id="pause-menu">
        <div class="pause-inner">
            <h2>PAUSED</h2>
            <div class="pause-btns">
                <button id="pause-resume-btn" class="btn-premium">RESUME</button>
                <button id="pause-back-btn" class="btn-premium">BACK TO MAIN MENU</button>
            </div>
            
            <div id="graphics-settings">
                <h3>SETTINGS</h3>
                <div class="setting-row">
                    <label for="setting-preset">Graphics Preset</label>
                    <select id="setting-preset">
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label for="setting-fps">Show FPS</label>
                    <input type="checkbox" id="setting-fps">
                </div>
                <div class="setting-row">
                    <label for="setting-fov">Field of View</label>
                    <select id="setting-fov">
                        <option value="50">50 (Narrow)</option>
                        <option value="60">60 (Standard)</option>
                        <option value="70">70 (Wide)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over overlay -->
    <div id="game-over">
        <div>
            <h1>GAME OVER</h1>
            <div class="sub">CREDITS <span id="final-credits">0</span></div>
            <button id="restart-btn" class="btn-premium" style="width: 100%;">RETRY</button>
            <button id="upgrades-btn" class="btn-premium" style="width: 100%; margin-top: 10px;">UPGRADES</button>
            <button id="game-over-back-btn" class="btn-premium" style="width: 100%; margin-top: 10px;">MAIN MENU</button>
        </div>
    </div>

    <!-- Upgrades Menu -->
    <div id="upgrades-menu" style="display: none;">
        <button id="upgrades-back-btn" class="btn-premium" style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 100; padding: 20px 40px; font-size: 20px; min-width: 200px;">EXIT</button>
        <div id="upgrades-bank" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; text-align: center; color: #0ff; font-family: 'Orbitron', sans-serif; font-size: 24px; text-shadow: 0 0 10px #0af;">
            CREDITS<br/><span id="banked-credits-display">0</span>
        </div>
        
        <div class="cockpit-screens">
            <div class="top-screens">
                <div id="screen-active" class="cockpit-screen">
                    <div class="screen-title">ACTIVE UPGRADES</div>
                    <div id="active-grid" class="upgrade-grid">
                        <!-- 5x3 grid cells will be injected here -->
                    </div>
                </div>
                <div class="joystick-space"></div>
                <div id="screen-info" class="cockpit-screen">
                    <div class="screen-title">UPGRADE TERMINAL</div>
                    <div id="info-content">
                        <h2 id="info-title">SELECT AN UPGRADE</h2>
                        <div id="info-cost">Cost: ---</div>
                        <p id="info-desc">---</p>
                        <button id="buy-btn" class="btn-premium" disabled>BUY</button>
                    </div>
                </div>
            </div>
            <div class="bottom-screen">
                <div id="screen-available" class="cockpit-screen">
                    <div style="display: flex; flex-direction: column; width: 200px; border-right: 2px solid #0af;">
                        <div class="screen-title">CATEGORIES</div>
                        <div class="category-sidebar">
                            <button class="cat-btn active" data-cat="engine">ENGINE</button>
                            <button class="cat-btn" data-cat="economy">ECONOMY</button>
                            <button class="cat-btn" data-cat="defense">DEFENSE</button>
                        </div>
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column;">
                        <div class="screen-title">AVAILABLE UPGRADES</div>
                        <div id="available-list">
                            <!-- Available upgrades injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
    { "imports": { 
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "stats": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/stats.module.js"
    } }
    </script>
    <div id="startup-fade"></div>

    <!-- Main script -->
    <script type="module" src="/src/main.js"></script>
</body>

</html>
